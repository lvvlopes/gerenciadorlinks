<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkVault Saver</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0b0e;
      --bg2: #15161c;
      --bg3: #1a1b24;
      --border: #2a2c3a;
      --text: #e8e9f0;
      --muted: #9498b0;
      --faint: #5c607a;
      --volt: #39ff14;
      --volt-dim: rgba(57,255,20,0.12);
      --volt-glow: 0 0 16px rgba(57,255,20,0.25);
      --orange: #f97316;
      --orange-dim: rgba(249,115,22,0.12);
      --red: #ef4444;
    }

    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    .logo {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--volt-dim);
      border: 1px solid rgba(57,255,20,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .header-text h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; }
    .header-text h1 span { color: var(--volt); }
    .header-text p { font-size: 10px; color: var(--faint); margin-top: 1px; }

    /* ── States ── */
    .state { display: none; padding: 16px; }
    .state.active { display: block; }

    /* ── Loading ── */
    #state-loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px 16px;
      text-align: center;
    }
    #state-loading.active { display: flex; }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border);
      border-top-color: var(--volt);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Preview card ── */
    .preview-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .preview-thumb {
      width: 100%; height: 100px;
      object-fit: cover;
      display: block;
      background: var(--bg2);
    }
    .preview-thumb.hidden { display: none; }
    .preview-body { padding: 10px 12px; }
    .preview-title {
      font-size: 13px; font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .preview-url {
      font-size: 10px; color: var(--faint);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .preview-content {
      margin-top: 8px;
      font-size: 11px; color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      background: var(--bg2);
      border-radius: 6px;
      padding: 6px 8px;
    }

    /* ── Form ── */
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 10px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select, textarea {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--volt); }
    input::placeholder, textarea::placeholder { color: var(--faint); }
    textarea { resize: vertical; min-height: 60px; }
    select { appearance: none; cursor: pointer; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--volt);
      color: #000;
      box-shadow: var(--volt-glow);
    }
    .btn-primary:hover { background: #4dff28; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .btn-secondary {
      background: var(--bg2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { color: var(--text); border-color: #3a3c4e; }

    /* ── Success ── */
    #state-success {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px 16px;
      text-align: center;
    }
    #state-success.active { display: flex; }
    .success-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--volt-dim);
      border: 1px solid rgba(57,255,20,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .success-title { font-size: 14px; font-weight: 700; }
    .success-msg { font-size: 11px; color: var(--muted); max-width: 240px; line-height: 1.5; }

    /* ── Error ── */
    .error-banner {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: #fca5a5;
      margin-bottom: 10px;
      display: none;
    }
    .error-banner.show { display: block; }

    /* ── Settings link ── */
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }
    .settings-row span { font-size: 10px; color: var(--faint); }
    .settings-btn {
      font-size: 10px; color: var(--faint);
      background: none; border: none; cursor: pointer;
      padding: 2px 6px; border-radius: 4px;
      transition: color 0.15s;
      font-family: inherit;
    }
    .settings-btn:hover { color: var(--volt); }

    /* ── Config screen ── */
    #state-config { display: none; }
    #state-config.active { display: block; }
    .config-title { font-size: 12px; font-weight: 700; margin-bottom: 12px; color: var(--text); }
    .config-hint { font-size: 10px; color: var(--faint); margin-top: 4px; line-height: 1.4; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">⚡</div>
  <div class="header-text">
    <h1>Link<span>Vault</span></h1>
    <p>Salvar no seu vault pessoal</p>
  </div>
</div>

<!-- Loading -->
<div id="state-loading">
  <div class="spinner"></div>
  <p style="color:var(--muted);font-size:12px;">Lendo conteúdo da página...</p>
</div>

<!-- Main form -->
<div id="state-form" class="state">
  <div class="error-banner" id="error-banner"></div>

  <!-- Preview -->
  <div class="preview-card" id="preview-card">
    <img id="preview-thumb" class="preview-thumb hidden" alt="" />
    <div class="preview-body">
      <div class="preview-title" id="preview-title">—</div>
      <div class="preview-url" id="preview-url">—</div>
      <div class="preview-content" id="preview-content" style="display:none"></div>
    </div>
  </div>

  <!-- Custom title -->
  <div class="field">
    <label>Título (opcional)</label>
    <input type="text" id="custom-title" placeholder="Deixe em branco para usar o original" />
  </div>

  <!-- Group + Provider -->
  <div class="row">
    <div class="field" style="margin-bottom:0">
      <label>Grupo</label>
      <select id="group-select">
        <option value="">Sem grupo</option>
      </select>
    </div>
    <div class="field" style="margin-bottom:0">
      <label>IA</label>
      <select id="provider-select">
        <option value="anthropic">Claude</option>
        <option value="openai">GPT</option>
        <option value="ollama">Llama</option>
      </select>
    </div>
  </div>

  <div style="margin-top:10px"></div>

  <!-- Notes -->
  <div class="field">
    <label>Anotação pessoal (opcional)</label>
    <textarea id="custom-notes" placeholder="Seus comentários sobre este link..."></textarea>
  </div>

  <!-- Save button -->
  <button class="btn btn-primary" id="btn-save">
    <span>⚡</span> Salvar no LinkVault
  </button>
</div>

<!-- Success -->
<div id="state-success">
  <div class="success-icon">✓</div>
  <div class="success-title">Salvo com sucesso!</div>
  <div class="success-msg" id="success-msg">Link adicionado ao seu vault com resumo gerado pela IA.</div>
  <button class="btn btn-secondary" id="btn-open-vault" style="width:auto;padding:7px 16px;margin-top:4px">
    Abrir LinkVault ↗
  </button>
</div>

<!-- Config screen -->
<div id="state-config" class="state">
  <div class="config-title">⚙️ Configurações</div>
  <div class="field">
    <label>URL do seu LinkVault</label>
    <input type="url" id="config-api-url" placeholder="http://localhost:8000" />
    <div class="config-hint">URL do backend FastAPI. Ex: http://localhost:8000 ou https://sua-api.railway.app</div>
  </div>
  <div class="field">
    <label>URL do frontend (para abrir o vault)</label>
    <input type="url" id="config-frontend-url" placeholder="http://localhost:3000" />
  </div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn btn-primary" id="btn-save-config" style="flex:1">Salvar</button>
    <button class="btn btn-secondary" id="btn-cancel-config" style="flex:1">Cancelar</button>
  </div>
</div>

<!-- Footer -->
<div class="settings-row">
  <span id="footer-status">Pronto</span>
  <button class="settings-btn" id="btn-config">⚙ Configurar</button>
</div>

<script src="src/popup.js"></script>
</body>
</html>
